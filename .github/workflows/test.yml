name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.x'

    - name: Run Tests
      run: make test

    - name: Run go vet
      run: make vet

    - name: Check formatting
      run: make fmt-check

    - name: Measure coverage
      run: make coverage
